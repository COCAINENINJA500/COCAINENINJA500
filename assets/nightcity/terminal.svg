<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img">
  <defs>
    <linearGradient id="pgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ff2d95"/>
    </linearGradient>
    <filter id="glowt" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="30" y="20" width="1140" height="320" rx="14" fill="#0a0313" stroke="url(#pgrad)" stroke-width="2" filter="url(#glowt)"/>

  <circle cx="66" cy="54" r="7" fill="#ff5f57"/>
  <circle cx="90" cy="54" r="7" fill="#febc2e"/>
  <circle cx="114" cy="54" r="7" fill="#28c840"/>
  <text x="150" y="60" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="15" fill="#6b7280">nightcity — zsh</text>
  <line x1="30" y1="78" x2="1170" y2="78" stroke="#a855f7" stroke-opacity="0.25"/>

  <g font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="19">
    <text x="66" y="122"><tspan fill="#a855f7" font-weight="bold">&gt;_ </tspan><tspan fill="#22d3ee">whoami</tspan></text>
    <text x="66" y="154"><tspan fill="#f5f3ff" font-weight="bold">COCAINENINJA500</tspan><tspan fill="#6b7280"> // clearance: ghost</tspan></text>

    <text x="66" y="196"><tspan fill="#a855f7" font-weight="bold">&gt;_ </tspan><tspan fill="#22d3ee">field --list</tspan></text>
    <text x="66" y="228"><tspan fill="#e5e7eb">security</tspan><tspan fill="#6b7280"> · </tspan><tspan fill="#e5e7eb">pentest</tspan><tspan fill="#6b7280"> · </tspan><tspan fill="#e5e7eb">osint</tspan></text>
    <text x="66" y="260"><tspan fill="#e5e7eb">python</tspan><tspan fill="#6b7280"> · </tspan><tspan fill="#e5e7eb">go</tspan><tspan fill="#6b7280"> · </tspan><tspan fill="#e5e7eb">typescript</tspan></text>

    <text x="66" y="306"><tspan fill="#a855f7" font-weight="bold">&gt;_ </tspan></text>
    <rect x="98" y="290" width="12" height="22" fill="#facc15">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
