<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img">
  <defs>
    <linearGradient id="bg1s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050208"/>
      <stop offset="1" stop-color="#0d0318"/>
    </linearGradient>
    <radialGradient id="sweep1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="260" fill="url(#bg1s)"/>
  <rect x="0" y="0" width="1200" height="1" fill="#a855f7" fill-opacity="0.35"/>

  <g>
    <circle cx="300" cy="130" r="100" fill="none" stroke="#a855f7" stroke-opacity="0.28"/>
    <circle cx="300" cy="130" r="70" fill="none" stroke="#a855f7" stroke-opacity="0.20"/>
    <circle cx="300" cy="130" r="40" fill="none" stroke="#a855f7" stroke-opacity="0.16"/>
    <line x1="200" y1="130" x2="400" y2="130" stroke="#a855f7" stroke-opacity="0.14"/>
    <line x1="300" y1="30" x2="300" y2="230" stroke="#a855f7" stroke-opacity="0.14"/>
    <g>
      <path d="M300,130 L300,30 A100,100 0 0,1 386.6,80 Z" fill="url(#sweep1)"/>
      <line x1="300" y1="130" x2="300" y2="30" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.9"/>
      <animateTransform attributeName="transform" type="rotate" from="0 300 130" to="360 300 130" dur="4s" repeatCount="indefinite"/>
    </g>
    <circle cx="352" cy="86" r="4" fill="#00f0ff">
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="248" cy="176" r="3" fill="#facc15">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="520" y="118" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="40" font-weight="bold" fill="#e9d5ff">在噪声中找信号</text>
  <text x="522" y="162" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="18" fill="#22d3ee">&gt; FINDING SIGNAL IN THE NOISE</text>
  <text x="838" y="162" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="18" fill="#22d3ee">_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/></text>
</svg>
