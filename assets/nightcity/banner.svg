<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050208"/>
      <stop offset="1" stop-color="#0d0318"/>
    </linearGradient>
    <linearGradient id="pgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ff2d95"/>
    </linearGradient>
    <linearGradient id="cgrid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <filter id="glowp" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="g1" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#a855f7" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg1)"/>
  <rect width="1200" height="300" fill="url(#g1)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#pgrad)"/>
  <rect x="0" y="297" width="1200" height="3" fill="url(#pgrad)"/>

  <text x="90" y="92" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="20" fill="#facc15" fill-opacity="0.9">NIGHT CITY // SECTOR 500</text>

  <g font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="58" font-weight="bold">
    <text x="86" y="168" fill="#ff0033" fill-opacity="0.55" letter-spacing="2">COCAINENINJA500
      <animate attributeName="x" values="86;86;80;90;86;86" keyTimes="0;0.62;0.66;0.70;0.74;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;1;0;1" keyTimes="0;0.62;0.64;0.66;0.68;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="94" y="168" fill="#00f0ff" fill-opacity="0.5" letter-spacing="2">COCAINENINJA500
      <animate attributeName="x" values="94;94;100;88;94;94" keyTimes="0;0.62;0.66;0.70;0.74;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;1;0;1" keyTimes="0;0.62;0.64;0.66;0.68;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="90" y="168" fill="url(#pgrad)" filter="url(#glowp)" letter-spacing="2">COCAINENINJA500</text>
  </g>

  <text x="90" y="228" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="15" fill="#6b7280">ESTABLISHING NEURAL LINK</text>
  <rect x="90" y="240" height="2" width="0" fill="url(#pgrad)">
    <animate attributeName="width" values="0;260" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="90" y="240" width="260" height="2" fill="#a855f7" fill-opacity="0.12"/>
</svg>
