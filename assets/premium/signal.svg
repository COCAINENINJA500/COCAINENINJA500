<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img">
  <rect width="1200" height="240" fill="#000000"/>
  <rect x="0" y="0" width="1200" height="1" fill="#1f1f1f"/>

  <g>
    <circle cx="270" cy="120" r="88" fill="none" stroke="#1f1f1f"/>
    <circle cx="270" cy="120" r="58" fill="none" stroke="#1a1a1a"/>
    <circle cx="270" cy="120" r="28" fill="none" stroke="#161616"/>
    <line x1="182" y1="120" x2="358" y2="120" stroke="#161616"/>
    <line x1="270" y1="32" x2="270" y2="208" stroke="#161616"/>
    <g>
      <path d="M270,120 L270,32 A88,88 0 0,1 346,76 Z" fill="#22c55e" fill-opacity="0.06"/>
      <line x1="270" y1="120" x2="270" y2="32" stroke="#22c55e" stroke-width="1" stroke-opacity="0.55"/>
      <animateTransform attributeName="transform" type="rotate" from="0 270 120" to="360 270 120" dur="6s" repeatCount="indefinite"/>
    </g>
    <circle cx="312" cy="84" r="2.5" fill="#22c55e" fill-opacity="0.8">
      <animate attributeName="opacity" values="0;0.8;0" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="470" y="112" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="34" font-weight="bold" fill="#ffffff">在噪声中找信号</text>
  <text x="472" y="150" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="15" fill="#888888">finding signal in the noise</text>
</svg>
