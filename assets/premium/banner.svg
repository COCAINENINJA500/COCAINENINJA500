<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img">
  <defs>
    <clipPath id="sliceA"><rect x="0" y="108" width="1200" height="12"/></clipPath>
    <clipPath id="sliceB"><rect x="0" y="120" width="1200" height="24"/></clipPath>
  </defs>

  <rect width="1200" height="220" fill="#0d1117"/>

  <text x="90" y="52" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="14" fill="#6e7681" letter-spacing="3">// TRANSMISSION</text>
  <text x="1110" y="52" text-anchor="end" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="14" fill="#6e7681" letter-spacing="3">EST.2026</text>

  <!-- base name: hides only during glitch burst -->
  <text x="90" y="142" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="52" font-weight="500" fill="#f0f6fc" letter-spacing="6">COCAINENINJA500
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.70;0.72;0.80;0.82;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- rgb split ghosts, burst only -->
  <text x="86" y="142" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="52" font-weight="500" fill="#22d3ee" fill-opacity="0" letter-spacing="6">COCAINENINJA500
    <animate attributeName="fill-opacity" values="0;0;0.5;0;0.5;0;0" keyTimes="0;0.70;0.72;0.75;0.77;0.80;1" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="94" y="142" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="52" font-weight="500" fill="#ef4444" fill-opacity="0" letter-spacing="6">COCAINENINJA500
    <animate attributeName="fill-opacity" values="0;0;0.5;0;0.5;0;0" keyTimes="0;0.70;0.72;0.75;0.77;0.80;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- displaced slices, burst only -->
  <g clip-path="url(#sliceA)">
    <text x="90" y="142" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="52" font-weight="500" fill="#f0f6fc" letter-spacing="6">COCAINENINJA500
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.70;0.72;0.80;0.82;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-10 0;7 0;-4 0;0 0" keyTimes="0;0.70;0.73;0.76;0.79;0.82" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>
  <g clip-path="url(#sliceB)">
    <text x="90" y="142" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="52" font-weight="500" fill="#f0f6fc" letter-spacing="6">COCAINENINJA500
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.70;0.72;0.80;0.82;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;8 0;-6 0;3 0;0 0" keyTimes="0;0.70;0.73;0.76;0.79;0.82" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="662" y="106" width="14" height="38" fill="#3fb950" fill-opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.9;0;0" keyTimes="0;0.5;0.5;1" dur="1.3s" repeatCount="indefinite"/>
  </rect>
</svg>
