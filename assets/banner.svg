<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f0d"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41"/>
      <stop offset="0.55" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff41" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00ff41" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#neon)"/>
  <rect x="0" y="277" width="1200" height="3" fill="url(#neon)"/>

  <rect x="0" y="-70" width="1200" height="70" fill="url(#scan)">
    <animate attributeName="y" values="-70;280" dur="7s" repeatCount="indefinite"/>
  </rect>

  <text x="92" y="92" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="21" fill="#00ff41" fill-opacity="0.8">root@ninja:~$ whoami</text>

  <text x="90" y="168" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="56" font-weight="bold" fill="url(#neon)" letter-spacing="2" filter="url(#glow)">COCAINENINJA500</text>
  <rect x="636" y="122" width="20" height="46" fill="#00ff41" filter="url(#glow)">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="92" y="215" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="19" fill="#8b949e">夜行开发者 night-shift builder · 网络安全 cybersecurity · lo-fi &amp; 808s</text>
</svg>
