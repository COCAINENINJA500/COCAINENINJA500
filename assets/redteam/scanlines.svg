<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80" role="img">
  <defs>
    <pattern id="sl2" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ff2b2b" fill-opacity="0.05"/>
    </pattern>
    <filter id="nz2">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="80" fill="url(#sl2)"/>
  <rect width="1200" height="80" filter="url(#nz2)" opacity="0.06"/>
</svg>
