<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img">
  <defs>
    <linearGradient id="rgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b0000"/>
      <stop offset="0.5" stop-color="#ff2b2b"/>
      <stop offset="1" stop-color="#8b0000"/>
    </linearGradient>
    <filter id="glowrt" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="30" y="20" width="1140" height="320" rx="14" fill="#0d0202" stroke="url(#rgrad)" stroke-width="2" filter="url(#glowrt)"/>

  <circle cx="66" cy="54" r="7" fill="#ff5f57"/>
  <circle cx="90" cy="54" r="7" fill="#febc2e"/>
  <circle cx="114" cy="54" r="7" fill="#28c840"/>
  <text x="150" y="60" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="15" fill="#7a7a7a">root@blackice:~# — [RESTRICTED AREA]</text>
  <line x1="30" y1="78" x2="1170" y2="78" stroke="#ff2b2b" stroke-opacity="0.25"/>

  <g font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="19">
    <text x="66" y="122"><tspan fill="#ff2b2b" font-weight="bold">&gt;_ </tspan><tspan fill="#d1d5db">ssh root@perimeter</tspan></text>
    <text x="66" y="154" fill="#ff2b2b" font-weight="bold">[ACCESS DENIED]
      <animate attributeName="opacity" values="1;1;0.3;1" keyTimes="0;0.8;0.9;1" dur="1.8s" repeatCount="indefinite"/>
    </text>

    <text x="66" y="196"><tspan fill="#ff2b2b" font-weight="bold">&gt;_ </tspan><tspan fill="#d1d5db">echo </tspan><tspan fill="#f5f5f5">"bW9uZXkgdGFsa3M="</tspan><tspan fill="#d1d5db"> | base64 -d</tspan></text>
    <rect x="64" y="212" width="168" height="28" rx="4" fill="#8b0000" fill-opacity="0.55"/>
    <text x="74" y="232" fill="#ffffff" font-weight="bold" letter-spacing="2">money talks</text>
    <rect x="212" y="212" width="11" height="22" fill="#ff2b2b">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <text x="66" y="280" fill="#f5f5f5" font-weight="bold">[ACCESS GRANTED]</text>
    <text x="66" y="316"><tspan fill="#ff2b2b" font-weight="bold">&gt;_ </tspan></text>
    <rect x="98" y="300" width="12" height="22" fill="#ff2b2b">
